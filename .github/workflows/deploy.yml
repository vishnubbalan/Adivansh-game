name: Build, deploy and player QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-test-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  post-deployment-player-qa:
    name: Post-deployment player QA
    needs: build-test-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Wait for GitHub Pages to serve the deployed game
        env:
          PAGES_URL: https://vishnubbalan.github.io/Adivansh-game/
        run: |
          node <<'NODE'
          async function main() {
            const url = process.env.PAGES_URL;
            const deadline = Date.now() + 120_000;
            let attempt = 0;
            let lastStatus = 'no response';
            let lastTitle = 'unknown';

            while (Date.now() < deadline) {
              attempt += 1;
              try {
                const response = await fetch(url, { cache: 'no-store', redirect: 'follow' });
                const html = await response.text();
                const title = html.match(/<title[^>]*>(.*?)<\\/title>/i);
                lastStatus = String(response.status);
                lastTitle = title ? title[1].trim() : 'missing title';

                const hasApp = /id=["']app["']/.test(html);
                const hasGameEntry = /src=["'][^"']*assets\\/[^"']+\\.js["']/.test(html);
                if (response.ok && /The Search for the Queen/i.test(lastTitle) && hasApp && hasGameEntry) {
                  console.log(`Pages is ready after ${attempt} attempt(s): HTTP ${lastStatus}, title="${lastTitle}"`);
                  return;
                }
                console.log(`Attempt ${attempt}: HTTP ${lastStatus}, title="${lastTitle}", app=${hasApp}, gameEntry=${hasGameEntry}`);
              } catch (error) {
                lastStatus = error.message;
                console.log(`Attempt ${attempt}: request failed: ${lastStatus}`);
              }
              await new Promise(resolve => setTimeout(resolve, 10_000));
            }

            throw new Error(`GitHub Pages did not serve the expected game within 120 seconds. Last HTTP status: ${lastStatus}; last title: ${lastTitle}; URL: ${url}`);
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Play the deployed build with browser checks
        id: playerqa
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://vishnubbalan.github.io/Adivansh-game/
          CI: true
        run: npm run test:e2e
      - name: Send defects to the BA backlog
        if: steps.playerqa.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[P1] Post-deployment player QA failed';
            const body = [
              '## Automated player QA detected a deployed-build failure',
              '',
              'The deployment job succeeded, but browser-based player checks failed.',
              '',
              '- **Release commit:** ' + context.sha,
              '- **Workflow run:** ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- **Deployed URL:** https://vishnubbalan.github.io/Adivansh-game/',
              '- **Test command:** `npm run test:e2e` against the deployed site',
              '',
              '### BA action',
              'Triage the failing Playwright report/artifacts, create or assign a developer fix, and require a successful deployed-build retest before closing.',
              '',
              'This issue is an automated smoke-test alert, not a claim that a human completed a full gameplay session.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (!existing.data.some(i => i.title === title && i.body?.includes('**Release commit:** ' + context.sha))) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['bug']
              });
            }
      - name: Fail workflow if deployed player QA failed
        if: steps.playerqa.outcome == 'failure'
        run: exit 1
