name: Build, deploy and player QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-test-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  post-deployment-player-qa:
    name: Post-deployment player QA
    needs: build-test-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install chromium
      - name: Play the deployed build with browser checks
        id: playerqa
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://vishnubbalan.github.io/Adivansh-game/
          CI: true
        run: npm run test:e2e
      - name: Send defects to the BA backlog
        if: steps.playerqa.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[P1] Post-deployment player QA failed';
            const body = [
              '## Automated player QA detected a deployed-build failure',
              '',
              'The deployment job succeeded, but browser-based player checks failed.',
              '',
              '- **Release commit:** ' + context.sha,
              '- **Workflow run:** ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- **Deployed URL:** https://vishnubbalan.github.io/Adivansh-game/',
              '- **Test command:** `npm run test:e2e` against the deployed site',
              '',
              '### BA action',
              'Triage the failing Playwright report/artifacts, create or assign a developer fix, and require a successful deployed-build retest before closing.',
              '',
              'This issue is an automated smoke-test alert, not a claim that a human completed a full gameplay session.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (!existing.data.some(i => i.title === title && i.body?.includes('**Release commit:** ' + context.sha))) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['bug']
              });
            }
      - name: Fail workflow if deployed player QA failed
        if: steps.playerqa.outcome == 'failure'
        run: exit 1
