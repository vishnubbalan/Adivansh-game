name: Adivansh autonomous agent cycle

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: adivansh-agent-cycle
  cancel-in-progress: false

jobs:
  develop-and-propose:
    name: AI development cycle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and browser
        run: |
          npm install
          npx playwright install chromium

      - name: Run the Adivansh agent team
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          effort: high
          prompt-file: .github/agents/adivansh-cycle.md
          output-file: adivansh-agent-report.md

      - name: Create or update development pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/adivansh-agent-cycle
          delete-branch: true
          commit-message: "feat: autonomous Adivansh development iteration"
          title: "Adivansh agent cycle: gameplay and quality improvements"
          body: |
            ## Autonomous development cycle

            This pull request was prepared by the OpenAI Codex agent using the repository's agent operating rules.

            Please review the agent report and CI checks. This PR is eligible for automatic squash merge only when the configured required status checks pass.

            **Important:** automated checks are not a substitute for human playtesting or a production-quality certification.
          add-paths: |
            .
          labels: |
            automation
            agent-generated

      - name: Enable automatic merge after required checks pass
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: gh pr merge "$PR_URL" --auto --squash

      - name: Publish agent report when no code change was proposed
        if: steps.cpr.outputs.pull-request-number == ''
        run: |
          if [ -f adivansh-agent-report.md ]; then
            cat adivansh-agent-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The agent made no repository changes in this cycle." >> "$GITHUB_STEP_SUMMARY"
          fi
